name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.meta.outputs.page_url }}
      mode: ${{ steps.meta.outputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine base path, URL, and Pages mode
        id: meta
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
            echo "page_url=https://${OWNER}.github.io/" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
            echo "page_url=https://${OWNER}.github.io/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi

          STATUS=$(curl -s -o pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$STATUS" = "200" ] && grep -q '"build_type":[[:space:]]*"workflow"' pages.json; then
            echo "mode=workflow" >> "$GITHUB_OUTPUT"
          else
            echo "mode=branch" >> "$GITHUB_OUTPUT"
            if [ "$STATUS" != "200" ]; then
              echo "::warning::GitHub Pages 尚未在儲存庫設定中啟用，請至 https://github.com/${GITHUB_REPOSITORY}/settings/pages 開啟"
            fi
          fi
          rm -f pages.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        env:
          VITE_BASE_PATH: ${{ steps.meta.outputs.base_path }}
        run: npm run build -- --base="${{ steps.meta.outputs.base_path }}"

      - name: Upload Pages artifact (GitHub Actions mode)
        if: steps.meta.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload build artifact (gh-pages branch mode)
        if: steps.meta.outputs.mode != 'workflow'
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || needs.build.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (GitHub Actions mode)
        if: needs.build.outputs.mode == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Download build artifact (gh-pages branch mode)
        if: needs.build.outputs.mode != 'workflow'
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: ./dist

      - name: Deploy to gh-pages branch
        if: needs.build.outputs.mode != 'workflow'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
